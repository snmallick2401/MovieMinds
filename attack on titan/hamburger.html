<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoro's Santoryu Katanas - Hamburger Menu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #090d16;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Container Box */
    .menu-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    /* Santoryu Toggle Button */
    .santoryu-toggle {
      position: relative;
      background: transparent;
      border: none;
      cursor: pointer;
      width: 100px;
      height: 100px;
      padding: 0;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }

    /* Zoro's Haki Emerald Aura Effect */
    .haki-aura {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.45) 0%, rgba(5, 150, 105, 0.15) 50%, rgba(0, 0, 0, 0) 75%);
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      filter: blur(4px);
    }

    .santoryu-toggle:hover .haki-aura {
      opacity: 1;
      transform: scale(1.25);
    }

    .santoryu-toggle.active .haki-aura {
      opacity: 1;
      transform: scale(1.4);
      background: radial-gradient(circle, rgba(16, 185, 129, 0.6) 0%, rgba(5, 150, 105, 0.25) 55%, rgba(0, 0, 0, 0) 80%);
    }

    /* Slash FX Overlay */
    .slash-fx {
      position: absolute;
      width: 140px;
      height: 10px;
      background: linear-gradient(90deg, transparent, #10B981, #A7F3D0, #10B981, transparent);
      box-shadow: 0 0 12px #10B981, 0 0 20px #059669;
      opacity: 0;
      transform: scaleX(0) rotate(-15deg);
      pointer-events: none;
      z-index: 10;
    }

    /* Trigger Slash Animation on Active Toggle */
    .santoryu-toggle.slash-active .slash-fx {
      animation: animeSlash 0.35s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes animeSlash {
      0% {
        opacity: 1;
        transform: translateX(-60px) scaleX(0.2) rotate(-15deg);
      }
      50% {
        opacity: 1;
        transform: translateX(20px) scaleX(1.4) rotate(-5deg);
      }
      100% {
        opacity: 0;
        transform: translateX(80px) scaleX(0.1) rotate(0deg);
      }
    }

    /* Katana SVG Base */
    .katana-svg {
      width: 90px;
      height: 90px;
      z-index: 2;
      overflow: visible;
    }

    /* Individual Katana Layers */
    .katana {
      transition: transform 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.3s ease;
    }

    .top-katana {
      transform-origin: 60px 30px;
    }

    .middle-katana {
      transform-origin: 60px 60px;
    }

    .bottom-katana {
      transform-origin: 60px 90px;
    }

    /* Blade & Hilt Assembly (Unsheathing Motion) */
    .blade-hilt-group {
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* HOVER STATE: Micro-Unsheathe (~18% sliding right) */
    .santoryu-toggle:hover .blade-hilt-group {
      transform: translateX(12px);
    }

    /* Metallic Sheen Glint Animation */
    .glint-light {
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .santoryu-toggle:hover .glint-light {
      opacity: 1;
      animation: glintSweep 0.8s ease-in-out infinite alternate;
    }

    @keyframes glintSweep {
      0% { transform: translateX(-15px); }
      100% { transform: translateX(35px); }
    }

    /* OPEN STATE TRANSFORMATION ('X' Formation) */
    /* Top Blade (Wado Ichimonji): Moves down & rotates +45deg */
    .santoryu-toggle.active .top-katana {
      transform: translateY(30px) rotate(45deg);
    }

    .santoryu-toggle.active .top-katana .blade-hilt-group {
      transform: translateX(20px); /* Fully Unsheathes */
    }

    /* Bottom Blade (Enma): Moves up & rotates -45deg */
    .santoryu-toggle.active .bottom-katana {
      transform: translateY(-30px) rotate(-45deg);
    }

    .santoryu-toggle.active .bottom-katana .blade-hilt-group {
      transform: translateX(20px); /* Fully Unsheathes */
    }

    /* Middle Blade (Sandai Kitetsu): Rapid horizontal slash out to right */
    .santoryu-toggle.active .middle-katana {
      transform: translateX(90px);
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="menu-container">
    <button class="santoryu-toggle" id="santoryuToggle" aria-label="Toggle Navigation Menu">
      
      <!-- Zoro's Haki Glow Background -->
      <div class="haki-aura"></div>

      <!-- Anime Sword Slash Effect Overlay -->
      <div class="slash-fx"></div>

      <!-- Katanas SVG -->
      <svg class="katana-svg" viewBox="0 0 120 120">
        <defs>
          <!-- Steel Blade Metallic Gradient -->
          <linearGradient id="steelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#64748B" />
            <stop offset="40%" stop-color="#E2E8F0" />
            <stop offset="70%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#94A3B8" />
          </linearGradient>

          <!-- Gold Accent Gradient -->
          <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCD34D" />
            <stop offset="50%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#B45309" />
          </linearGradient>

          <!-- Metallic Sheen Sweep Filter -->
          <linearGradient id="glintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="50%" stop-color="rgba(255,255,255,0.9)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
          </linearGradient>
        </defs>

        <!-- ==========================================
             1. TOP KATANA: Wado Ichimonji (Pure White)
             ========================================== -->
        <g class="katana top-katana">
          <!-- Scabbard (Saya) -->
          <rect x="36" y="27" width="62" height="6" rx="2" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- Gold Kojiri (Scabbard Tip) -->
          <rect x="92" y="27" width="6" height="6" rx="1" fill="url(#goldGradient)"/>

          <!-- Sliding Blade & Hilt Assembly -->
          <g class="blade-hilt-group">
            <!-- Exposed Steel Blade -->
            <path d="M 28 28.5 L 65 28.5 L 65 31.5 L 28 31.5 Z" fill="url(#steelGradient)"/>
            <!-- Metallic Glint Sweep -->
            <rect class="glint-light" x="32" y="28" width="12" height="4" fill="url(#glintGrad)"/>

            <!-- Circular Gold Tsuba (Handguard) -->
            <circle cx="28" cy="30" r="5.5" fill="url(#goldGradient)" stroke="#78350F" stroke-width="0.6"/>

            <!-- Tsuka (Hilt) - White with Tsuka-Ito Diamonds -->
            <rect x="8" y="27" width="20" height="6" rx="1.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.6"/>
            <!-- Hilt Wrap Diamond Patterns -->
            <polygon points="11,30 13,28 15,30 13,32" fill="#CBD5E1"/>
            <polygon points="16,30 18,28 20,30 18,32" fill="#CBD5E1"/>
            <polygon points="21,30 23,28 25,30 23,32" fill="#CBD5E1"/>
            <!-- Gold Kashira (Hilt Cap) -->
            <rect x="6" y="27" width="3" height="6" rx="1" fill="url(#goldGradient)"/>
          </g>
        </g>

        <!-- ==========================================
             2. MIDDLE KATANA: Sandai Kitetsu (Crimson)
             ========================================== -->
        <g class="katana middle-katana">
          <!-- Scabbard (Saya) - Crimson Red with Black Wraps -->
          <rect x="36" y="57" width="62" height="6" rx="2" fill="#991B1B" stroke="#7F1D1D" stroke-width="0.8"/>
          <rect x="52" y="57" width="4" height="6" fill="#18181B"/>
          <rect x="68" y="57" width="4" height="6" fill="#18181B"/>
          <!-- Black Kojiri Cap -->
          <rect x="92" y="57" width="6" height="6" rx="1" fill="#18181B"/>

          <!-- Sliding Blade & Hilt Assembly -->
          <g class="blade-hilt-group">
            <!-- Steel Blade with Reddish Hamon Tint -->
            <path d="M 28 58.5 L 65 58.5 L 65 61.5 L 28 61.5 Z" fill="url(#steelGradient)"/>
            <line x1="30" y1="61" x2="62" y2="61" stroke="#991B1B" stroke-width="0.6" opacity="0.8"/>
            <!-- Metallic Glint Sweep -->
            <rect class="glint-light" x="32" y="58" width="12" height="4" fill="url(#glintGrad)"/>

            <!-- Cross-Shaped Tsuba (Handguard) -->
            <path d="M 25 57 H 31 V 55 H 25 Z M 25 63 H 31 V 65 H 25 Z M 27 55 H 29 V 65 H 27 Z" fill="#18181B" stroke="#451A03" stroke-width="0.5"/>

            <!-- Tsuka (Hilt) - Crimson Red & Black Wrapping -->
            <rect x="8" y="57" width="20" height="6" rx="1.5" fill="#991B1B" stroke="#450A0A" stroke-width="0.6"/>
            <!-- Black Diamond Wrap Patterns -->
            <polygon points="11,60 13,58 15,60 13,62" fill="#18181B"/>
            <polygon points="16,60 18,58 20,60 18,62" fill="#18181B"/>
            <polygon points="21,60 23,58 25,60 23,62" fill="#18181B"/>
            <!-- Gold Kashira Cap -->
            <rect x="6" y="57" width="3" height="6" rx="1" fill="url(#goldGradient)"/>
          </g>
        </g>

        <!-- ==========================================
             3. BOTTOM KATANA: Enma (Royal Purple)
             ========================================== -->
        <g class="katana bottom-katana">
          <!-- Scabbard (Saya) - Deep Purple with Gold Motifs -->
          <rect x="36" y="87" width="62" height="6" rx="2" fill="#581C87" stroke="#3B0764" stroke-width="0.8"/>
          <!-- Gold Clover/Trefoil Motifs on Scabbard -->
          <circle cx="50" cy="90" r="1.2" fill="url(#goldGradient)"/>
          <circle cx="66" cy="90" r="1.2" fill="url(#goldGradient)"/>
          <circle cx="82" cy="90" r="1.2" fill="url(#goldGradient)"/>
          <!-- Gold Kojiri Cap -->
          <rect x="92" y="87" width="6" height="6" rx="1" fill="url(#goldGradient)"/>

          <!-- Sliding Blade & Hilt Assembly -->
          <g class="blade-hilt-group">
            <!-- Steel Blade -->
            <path d="M 28 88.5 L 65 88.5 L 65 91.5 L 28 91.5 Z" fill="url(#steelGradient)"/>
            <!-- Metallic Glint Sweep -->
            <rect class="glint-light" x="32" y="88" width="12" height="4" fill="url(#glintGrad)"/>

            <!-- Trefoil / Lotus Flame Gold Tsuba -->
            <path d="M 28 84 A 3.5 3.5 0 0 1 31.5 87.5 A 3.5 3.5 0 0 1 31.5 92.5 A 3.5 3.5 0 0 1 28 96 A 3.5 3.5 0 0 1 24.5 92.5 A 3.5 3.5 0 0 1 24.5 87.5 A 3.5 3.5 0 0 1 28 84 Z" fill="url(#goldGradient)" stroke="#581C87" stroke-width="0.5"/>

            <!-- Tsuka (Hilt) - Deep Purple with Gold Wrap -->
            <rect x="8" y="87" width="20" height="6" rx="1.5" fill="#581C87" stroke="#2E1065" stroke-width="0.6"/>
            <!-- Gold Diamond Patterns -->
            <polygon points="11,90 13,88 15,90 13,92" fill="url(#goldGradient)"/>
            <polygon points="16,90 18,88 20,90 18,92" fill="url(#goldGradient)"/>
            <polygon points="21,90 23,88 25,90 23,92" fill="url(#goldGradient)"/>
            <!-- Gold Kashira Cap -->
            <rect x="6" y="87" width="3" height="6" rx="1" fill="url(#goldGradient)"/>
          </g>
        </g>

      </svg>
    </button>
  </div>

  <script>
    const santoryuToggle = document.getElementById('santoryuToggle');

    santoryuToggle.addEventListener('click', () => {
      const isActive = santoryuToggle.classList.contains('active');

      if (!isActive) {
        // Trigger high-speed slash particle FX animation
        santoryuToggle.classList.add('slash-active');
        setTimeout(() => {
          santoryuToggle.classList.remove('slash-active');
        }, 400);
      }

      // Toggle 'X' Active state
      santoryuToggle.classList.toggle('active');
    });
  </script>

</body>
</html>
