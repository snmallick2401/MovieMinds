name: Supabase Keep Alive

on:
  schedule:
    # Runs every 2 days at 04:00 UTC to prevent Supabase 7-day inactivity pause
    - cron: "0 4 */2 * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Keep Supabase & Database Active
    runs-on: ubuntu-latest
    steps:
      - name: Ping MovieMinds Database Health Check
        run: |
          echo "Sending keep-alive request to database health endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME:%{time_total}s" https://movie-minds-i3xt.vercel.app/api/health)
          echo "$RESPONSE"
          
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Successfully pinged database! Supabase inactivity counter reset."
          else
            echo "⚠️ Health check returned status $STATUS"
          fi

      - name: Direct Ping to Supabase Auth Health
        run: |
          echo "Pinging Supabase Auth Health API..."
          curl -s -o /dev/null -w "Supabase Auth Status: %{http_code}\n" https://iihmjkxfcuibjihbyhyd.supabase.co/auth/v1/health || true
